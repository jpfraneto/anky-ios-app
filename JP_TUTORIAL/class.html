<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; background: #0f0f1a; color: #d8d8e8;
  }

  /* ── Left: file list ── */
  #sidebar {
    width: 240px; min-width: 240px; background: #161625;
    border-right: 1px solid #2a2a40; padding: 20px 14px;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #sidebar h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
    color: #e94560; margin-bottom: 16px; padding-left: 8px;
  }
  #sidebar button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: #8888aa; padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 500; margin-bottom: 2px;
    transition: all .2s ease;
  }
  #sidebar button:hover { background: #1e1e35; color: #ccc; transform: translateX(4px); }
  #sidebar button.active { background: #e94560; color: #fff; transform: translateX(4px); }

  /* ── Center: rendered markdown ── */
  #content {
    flex: 1; overflow-y: auto; padding: 40px 48px;
    line-height: 1.75; font-size: 15px;
    opacity: 1; transition: opacity .3s ease;
    scroll-behavior: smooth;
  }
  #content.fading { opacity: 0; }

  #content h1 { color: #e94560; font-size: 26px; margin-bottom: 12px; }
  #content h2 { color: #b0b0d0; font-size: 20px; margin-top: 32px; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 6px; }
  #content h3 { color: #9090c0; font-size: 16px; margin-top: 20px; margin-bottom: 8px; }
  #content p { margin-bottom: 12px; }
  #content a { color: #5dade2; text-decoration: none; }
  #content a:hover { text-decoration: underline; }
  #content code {
    background: #1a1a2e; padding: 2px 7px; border-radius: 4px;
    font-size: 13px; font-family: 'SF Mono', Menlo, monospace; color: #c8c8f0;
  }
  #content pre {
    background: #12121f; padding: 18px; border-radius: 10px;
    overflow-x: auto; margin: 14px 0; border: 1px solid #222;
  }
  #content pre code { padding: 0; background: none; }
  #content ul, #content ol { padding-left: 24px; margin: 10px 0; }
  #content li { margin-bottom: 4px; }
  #content blockquote {
    border-left: 3px solid #e94560; padding-left: 16px; color: #888;
    margin: 14px 0; font-style: italic;
  }
  #content strong { color: #e0e0f0; }
  #content hr { border: none; border-top: 1px solid #222; margin: 24px 0; }

  #placeholder {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #333; font-size: 18px; font-weight: 500;
  }

  /* ── Right: notes ── */
  #notes-panel {
    width: 300px; min-width: 300px; background: #161625;
    border-left: 1px solid #2a2a40; display: flex; flex-direction: column;
    padding: 20px 16px;
  }
  #notes-panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
    color: #e94560; margin-bottom: 6px;
  }
  #session-label { font-size: 11px; color: #555; margin-bottom: 12px; }
  #notes {
    flex: 1; background: #0d0d1a; border: 1px solid #2a2a40; border-radius: 10px;
    color: #d8d8e8; padding: 16px; font-family: inherit; font-size: 14px;
    resize: none; line-height: 1.65; outline: none;
    transition: border-color .2s;
  }
  #notes:focus { border-color: #e94560; }
  #notes::placeholder { color: #333; }
  #save-status { font-size: 11px; color: #444; margin-top: 8px; text-align: right; }
  #export-btn {
    margin-top: 10px; background: #e94560; color: #fff; border: none;
    padding: 8px 0; border-radius: 8px; cursor: pointer; font-size: 13px;
    font-weight: 600; transition: opacity .2s;
  }
  #export-btn:hover { opacity: .85; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>

</div>

  <textarea id="notes" placeholder="Write your class notes here..."></textarea>
  <div id="save-status"></div>
  <button id="export-btn">Download notes as .txt</button>
</div>

<script>
// ── Session logic ──
const SESSION_KEY = "jp_class_session";
const SESSION_TS = "jp_class_ts";
const NOTES_KEY = "jp_class_notes";
const GAP = 30 * 60 * 1000;

function getSessionId() {
  const now = Date.now();
  const last = parseInt(localStorage.getItem(SESSION_TS) || "0");
  let id = parseInt(localStorage.getItem(SESSION_KEY) || "0");
  if (!id || (now - last > GAP)) {
    id = id + 1;
    localStorage.setItem(SESSION_KEY, id);
    localStorage.setItem(NOTES_KEY, "");
  }
  localStorage.setItem(SESSION_TS, now);
  return id;
}

const sessionId = getSessionId();
const sessionFile = String(sessionId).padStart(3, "0") + ".txt";
document.getElementById("session-label").textContent = "Session " + sessionId + "  ·  " + sessionFile;

const notesEl = document.getElementById("notes");
notesEl.value = localStorage.getItem(NOTES_KEY) || "";

let saveTimer;
notesEl.addEventListener("input", () => {
  localStorage.setItem(NOTES_KEY, notesEl.value);
  document.getElementById("save-status").textContent = "saving...";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    document.getElementById("save-status").textContent = "saved locally";
  }, 500);
});

document.getElementById("export-btn").addEventListener("click", () => {
  const blob = new Blob([notesEl.value], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = sessionFile;
  a.click();
});

// ── Build sidebar & load logic ──
const listEl = document.getElementById("file-list");
const contentEl = document.getElementById("content");

LESSONS.forEach((lesson, i) => {
  const btn = document.createElement("button");
  btn.textContent = lesson.label;
  btn.addEventListener("click", () => loadLesson(lesson, btn));
  listEl.appendChild(btn);
});

function loadLesson(lesson, btn) {
  listEl.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  contentEl.classList.add("fading");
  setTimeout(() => {
    contentEl.innerHTML = marked.parse(lesson.md);
    contentEl.scrollTop = 0;
    contentEl.classList.remove("fading");
  }, 250);
}
</script>
